display_name: Pinax Continuity Operator
short_description: Resume, diagnose, checkpoint, review, and give four-value outcome feedback for Pinax project continuity across Codex and Claude Code through the pinax continue CLI contract.
default_prompt: 继续这个项目：先用 pinax continue 状态契约诊断当前仓库 binding，再渲染 Resume Card；substantial 会话结束时创建 bounded checkpoint，并让用户在 trusted、corrected、wrong_project、insufficient 中显式选择一个 outcome。
