display_name: UI Spec Frontend Workflow
short_description: Enforce Tailwind CSS 4 utilities, tokens, component recipes, UI Spec, page patterns, React animation rules, and screenshot regression before frontend UI code is accepted.
default_prompt: Turn this product idea, PRD, wireframe, or UI image into a Tailwind CSS 4 and design-system constrained React workflow: UI Spec, page pattern, low-fidelity wireframe, component recipes, implementation, animation policy, and screenshot-based visual review.
