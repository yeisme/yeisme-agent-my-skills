# Change-aware CI maintained by scripts/maintain-workspace-ci.py.
name: Full CI extension
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        submodules: recursive
    - name: Run full gate
      shell: bash
      run: |-
        set -euo pipefail
        python3 scripts/test_network_install.py
'on':
  workflow_call: null
