display_name: Pinax Sync And Storage Operator
short_description: Configure Pinax storage, COS/S3/rclone backup mirrors, backend diagnostics, OS-scheduled sync, sync logs/conflicts, and ignore policy without exposing credentials.
default_prompt: Inspect or configure Pinax sync/storage for this vault using profile names, remote names, or secret refs only; handle backup mirror and ignore checks before writes, and keep Remote API Mode separate from Cloud Sync.
