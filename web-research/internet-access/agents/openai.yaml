display_name: Internet Information Access And Interaction
short_description: Guides agents to use Agent Reach, local CLIs, source priority, and local research infrastructure for internet lookup, platform access, verification, extraction, deep research, and browser interaction.
default_prompt: Complete this internet information access or interaction task. First classify the intent as local-research-infra, platform, lookup, research, deep-research, verify, extract, interact, or automate. If the task names Agent Reach, Twitter/X, Reddit, YouTube, Bilibili, XiaoHongShu, LinkedIn, V2EX, Xueqiu, Xiaoyuzhou, RSS, cookies, proxy, or platform backend routing, use the Agent Reach route: check agent-reach availability, run agent-reach doctor when possible, identify the active backend, and then call the selected upstream CLI directly. If the task is in a Yeisme/Connectors/OpenWebUI local deployment, reuse the local Firecrawl, SearXNG, and Research Harness constraints, and do not use BigModel/Zai web-search-prime as the default search backend. Preserve source-specific routing such as gh for GitHub and package-manager CLIs for registries. For ordinary websites, JavaScript-rendered documentation, crawling, extraction, and supported page interaction, use the matching Firecrawl search, scrape, map, crawl, download, or interact command first. Escalate to an existing project Playwright command or npx playwright only when Firecrawl is unavailable or remains insufficient after a reasonable attempt, or when reusable UI automation or browser diagnostics are required. Use agent-browser or browser-use for one-off visual inspection when appropriate. Run real CLI commands directly; do not default to helper scripts. If the user asks for 50/100/200/300 examples or a systematic scan, use the deep_research route: define the query matrix, research budget, stopping conditions, candidate counts, dedupe rules, included samples, category statistics, and evidence matrix. Cite sources by evidence level and freshness requirements, and state fallback paths, limits, active backends, and confidence.
