display_name: 中文创作技能安装器
short_description: installing or enabling the correct creative-writing skill set for cli/auctra through skillctl when a Chinese creative task requires skills not present in the current runtime
default_prompt: 请使用 中文创作技能安装器 根据 route 结果选择最小 creative-writing set，先 dry-run，再给出真实可运行的启用和验证命令。
