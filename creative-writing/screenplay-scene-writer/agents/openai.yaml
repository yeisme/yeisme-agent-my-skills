display_name: 中文场景剧本写手
short_description: writing, revising, or converting Chinese screenplay, stage, radio-drama, or scene scripts into producible scenes with visible action, dialogue, subtext, blocking, and transition
default_prompt: 请使用 中文场景剧本写手 把用户素材改写成可拍、可演、可录制的场景剧本，并标明输入缺口、小说式内容转译、质量检查、风险边界和下一步。
