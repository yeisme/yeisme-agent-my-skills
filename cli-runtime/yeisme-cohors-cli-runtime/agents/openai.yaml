display_name: Yeisme Cohors CLI Runtime
short_description: Develop the accepted Cohors Personal Company runtime through its bounded CLI/read-only TUI, run projections, adapters, evidence, and approved expansions.
default_prompt: Change or review cli/cohors as the accepted Personal Company MVP while preserving its current bounded CLI/read-only TUI scope, TypeScript/Bun-first architecture, local-first run evidence, structured output contracts, Pi/OMP package boundaries, English user-facing output, and Bun validation commands; treat daemon, Team Room, worker, memory, command-center, or Web work as unavailable unless an accepted OpenSpec change explicitly expands scope.
